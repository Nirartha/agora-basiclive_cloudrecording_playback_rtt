<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agora Live Streaming & Recording - 測試工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
  <!-- 引入 hls.js 用於播放 m3u8 串流 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; z-index: 10; }
    @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-pulse-red { animation: pulse-red 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    /* 字幕專用 CSS */
    .subtitle-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      pointer-events: none;
      z-index: 30;
    }
    .subtitle-text {
      background: rgba(0, 0, 0, 0.7);
      color: #4ade80; /* 綠色字幕 */
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      text-shadow: 1px 1px 2px black;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

  <div class="max-w-7xl mx-auto p-6">
    <header class="mb-8 border-b pb-4">
      <h1 class="text-3xl font-bold text-blue-600">Agora 直播與錄製測試工具</h1>
      <p class="text-sm text-gray-500 mt-2">包含 RTC 推播、即時字幕與 Cloud Recording 整合驗證</p>
    </header>

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
      
      <!-- 左側：設定控制面板 (已加入折疊功能) -->
      <div class="xl:col-span-4 space-y-4">
        
        <!-- 1. RTC 連線設定 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <button type="button" class="w-full px-6 py-4 flex justify-between items-center bg-gray-50 hover:bg-gray-100 transition-colors" onclick="toggleSection('rtc-section')">
            <h2 class="text-xl font-semibold text-gray-800">1. RTC 連線設定</h2>
            <svg id="rtc-section-icon" class="w-5 h-5 text-gray-500 transform rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          
          <div id="rtc-section" class="p-6 border-t border-gray-100">
            <form id="join-form" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700">App ID <span class="text-red-500">*</span></label>
                <input type="text" id="appid" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" required value="">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Channel Name <span class="text-red-500">*</span></label>
                <input type="text" id="channel" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" required value="">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Token <span class="text-red-500">*</span></label>
                <input type="text" id="token" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">UID (選填)</label>
                <input type="number" id="uid" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" placeholder="留空則自動分配">
              </div>

              <!-- 角色選擇 -->
              <div class="pt-4 border-t">
                <label class="block text-sm font-medium text-gray-700 mb-2">加入角色</label>
                <div class="flex gap-4">
                  <label class="flex items-center cursor-pointer">
                    <input type="radio" name="role" value="host" class="w-4 h-4 text-blue-600" checked onchange="toggleRoleUI()">
                    <span class="ml-2 text-sm">主播 (Host)</span>
                  </label>
                  <label class="flex items-center cursor-pointer">
                    <input type="radio" name="role" value="audience" class="w-4 h-4 text-blue-600" onchange="toggleRoleUI()">
                    <span class="ml-2 text-sm">觀眾 (Audience)</span>
                  </label>
                </div>
              </div>

              <div id="audience-options" class="hidden bg-gray-50 p-3 rounded-md">
                <label class="block text-sm font-medium text-gray-700 mb-2">觀眾延遲等級</label>
                <select id="audience-level" class="block w-full rounded-md border-gray-300 border p-2 text-sm">
                  <option value="1">標準直播 (Standard)</option>
                  <option value="2">極速直播 (Ultra Low Latency)</option>
                </select>
              </div>

              <div class="pt-2 flex gap-3">
                <button type="submit" id="join-btn" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 font-medium text-sm">加入頻道</button>
                <button type="button" id="leave-btn" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 font-medium text-sm" disabled>離開</button>
              </div>
            </form>
          </div>
        </div>

        <!-- 2. 即時字幕 (RTT) 設定 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <button type="button" class="w-full px-6 py-4 flex justify-between items-center bg-gray-50 hover:bg-gray-100 transition-colors" onclick="toggleSection('rtt-section')">
            <div class="flex items-center gap-3">
              <h2 class="text-xl font-semibold text-gray-800">2. 即時字幕 (RTT)</h2>
              <span id="rtt-status-badge" class="px-2 py-1 rounded text-xs font-bold bg-gray-200 text-gray-600">IDLE</span>
            </div>
            <svg id="rtt-section-icon" class="w-5 h-5 text-gray-500 transform rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          
          <div id="rtt-section" class="p-6 border-t border-gray-100 space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">RTT Payload (JSON 格式)</label>
              <textarea id="rtt-payload" rows="8" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-xs font-mono bg-gray-800 text-green-400"></textarea>
            </div>

            <div id="rtt-details" class="text-xs text-gray-500 break-all hidden bg-gray-50 p-2 rounded">
              <strong>Task ID:</strong> <span id="lbl-taskId">-</span><br>
            </div>

            <div class="pt-2 flex gap-2">
              <button type="button" id="start-rtt-btn" class="flex-1 bg-green-600 text-white py-2 px-2 rounded-md hover:bg-green-700 font-medium text-sm flex justify-center items-center">
                開啟字幕
              </button>
              <button type="button" id="stop-rtt-btn" class="flex-1 bg-gray-200 text-gray-700 py-2 px-2 rounded-md hover:bg-gray-300 font-medium text-sm disabled:opacity-50" disabled>
                停止
              </button>
            </div>
          </div>
        </div>

        <!-- 3. Cloud Recording 設定 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <button type="button" class="w-full px-6 py-4 flex justify-between items-center bg-gray-50 hover:bg-gray-100 transition-colors" onclick="toggleSection('rec-section')">
            <div class="flex items-center gap-3">
              <h2 class="text-xl font-semibold text-gray-800">3. 雲端錄製</h2>
              <span id="rec-status-badge" class="px-2 py-1 rounded text-xs font-bold bg-gray-200 text-gray-600">IDLE</span>
            </div>
            <svg id="rec-section-icon" class="w-5 h-5 text-gray-500 transform rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          
          <div id="rec-section" class="p-6 border-t border-gray-100 space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">CF Worker Proxy URL <span class="text-red-500">*</span></label>
              <input type="url" id="proxy-url" value="https://agora-cloud-recording.kuanyowchen.workers.dev/" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm bg-blue-50" required>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-sm font-medium text-gray-700">Customer ID</label>
                <input type="text" id="customer-id" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" value="">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Customer Secret</label>
                <input type="password" id="customer-secret" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" value="">
              </div>
            </div>
            
            <div>
              <label class="block text-sm font-medium text-gray-700">Start Payload (JSON 格式)</label>
              <textarea id="recording-payload" rows="6" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-xs font-mono bg-gray-800 text-green-400"></textarea>
            </div>

            <div id="rec-details" class="text-xs text-gray-500 break-all hidden bg-gray-50 p-2 rounded">
              <strong>Resource ID:</strong> <span id="lbl-resourceId">-</span><br>
              <strong>SID:</strong> <span id="lbl-sid">-</span>
            </div>

            <div class="pt-2 flex gap-2">
              <button type="button" id="start-rec-btn" class="flex-1 bg-red-600 text-white py-2 px-2 rounded-md hover:bg-red-700 font-medium text-sm flex justify-center items-center">
                開始錄製
              </button>
              <button type="button" id="query-rec-btn" class="flex-1 bg-blue-500 text-white py-2 px-2 rounded-md hover:bg-blue-600 font-medium text-sm disabled:opacity-50" disabled>
                查詢狀態
              </button>
              <button type="button" id="stop-rec-btn" class="flex-1 bg-gray-200 text-gray-700 py-2 px-2 rounded-md hover:bg-gray-300 font-medium text-sm disabled:opacity-50" disabled>
                停止
              </button>
            </div>
            
            <!-- API 日誌顯示區塊 -->
            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">API 狀態日誌 (Log)</label>
              <pre id="log-console" class="w-full h-40 p-3 bg-gray-900 text-green-400 text-xs font-mono rounded-md overflow-y-auto whitespace-pre-wrap">等待操作...</pre>
            </div>
          </div>
        </div>

      </div>

      <!-- 右側：視訊展示區 -->
      <div class="xl:col-span-8 space-y-6">
        
        <!-- 本地畫面 -->
        <div id="local-stream-wrapper" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 block">
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-lg font-semibold flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-green-500"></span> 本地畫面 (Local Stream)
            </h3>
            <div id="host-controls" class="hidden gap-2">
              <button id="toggle-video-btn" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1 px-3 rounded border">關閉視訊</button>
              <button id="toggle-audio-btn" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1 px-3 rounded border">靜音</button>
            </div>
          </div>
          <div id="local-player" class="w-full aspect-video bg-gray-800 rounded-lg overflow-hidden relative flex items-center justify-center text-gray-400">
            <div id="rec-indicator" class="hidden absolute top-4 right-4 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded animate-pulse-red z-20 flex items-center gap-1">
              <div class="w-2 h-2 bg-white rounded-full"></div> REC
            </div>
            尚未加入頻道
          </div>
        </div>

        <!-- 遠端畫面 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <h3 class="text-lg font-semibold mb-3 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span> 遠端畫面 (Remote Streams)
          </h3>
          <div id="remote-playerlist" class="grid grid-cols-1 gap-6"></div>
          <div id="no-remote-tips" class="text-center text-gray-400 py-12 bg-gray-50 rounded-lg border border-dashed border-gray-200">
            目前無人推流
          </div>
        </div>

        <!-- 4. HLS 即時回放 (Live Playback) -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-lg font-semibold flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span> 4. HLS 即時回放 (Live Playback)
            </h3>
            <span id="hls-status" class="text-xs text-gray-500 font-medium bg-gray-100 px-2 py-1 rounded">未載入</span>
          </div>
          
          <div class="mb-3 space-y-2">
            <div>
              <label class="block text-xs font-medium text-gray-700">S3 / CDN Base URL <span class="text-red-500">*</span></label>
              <input type="url" id="hls-base-url" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" placeholder="例如: https://<YOUR_BUCKET_NAME>.s3.<REGION>.amazonaws.com/" value="https://<YOUR_BUCKET_NAME>.s3.<REGION>.amazonaws.com/">
            </div>
            <div class="flex gap-2">
              <input type="text" id="hls-full-url" class="block w-full rounded-md border-gray-200 border p-2 text-xs bg-gray-50 text-gray-500" readonly placeholder="自動產生的 .m3u8 完整網址會顯示在這裡">
              <button type="button" id="load-hls-btn" class="bg-purple-600 text-white py-1 px-4 rounded-md hover:bg-purple-700 font-medium text-sm whitespace-nowrap disabled:opacity-50">
                載入回放
              </button>
            </div>
          </div>

          <div class="w-full aspect-video bg-black rounded-lg overflow-hidden relative flex items-center justify-center">
            <video id="hls-video-player" class="w-full h-full" crossorigin="anonymous" controls muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // UI 面板摺疊控制
    // ==========================================
    function toggleSection(sectionId) {
      const content = document.getElementById(sectionId);
      const icon = document.getElementById(sectionId + '-icon');
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        content.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }

    // ==========================================
    // VTT & worker 變數與邏輯
    // ==========================================

    // === VTT 收集專用變數 ===
    let recordingStartTime = null; 
    let vttSubtitles = [];         // 用來存放每一句字幕的陣列

    // 輔助函式：將毫秒轉換為 VTT 標準時間格式 (HH:MM:SS.mmm)
    function formatVttTime(ms) {
      const hours = Math.floor(ms / 3600000);
      const minutes = Math.floor((ms % 3600000) / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = Math.floor(ms % 1000);
      
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
    }

    // === 打包 VTT 檔案相關 ===
    async function generateAndUploadVTT(sid) {
        printLog("開始打包 VTT 檔案...");
        
        // 1. 組合 VTT 標頭與內容
        let vttString = "WEBVTT\n\n";
        vttSubtitles.forEach((sub, index) => {
            vttString += `${index + 1}\n`;
            vttString += `${sub.start} --> ${sub.end}\n`;
            vttString += `${sub.text}\n\n`;
        });

        printLog("VTT 打包完成，準備上傳...");
        // 可以在這裡 console.log(vttString) 預覽一下成果

        try {
            const s3WorkerUrl = "https://agora-vtt-s3-uploader.kuanyowchen.workers.dev";
            const channel = document.getElementById("channel").value.trim();
            
            // 2. 使用 cloudRecording/ 資料夾，並以 SID + Channel 命名
            // 這樣產生的檔名就會是：cloudRecording/64ae36f4274..._streamDemoDennis.vtt
            // 與你的 m3u8 和 mp4 檔案完美對齊！
            const fileName = `cloudRecording/${sid}_${channel}.vtt`;
            
            const response = await fetch(s3WorkerUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "text/vtt",
                    "X-File-Name": fileName
                },
                body: vttString
            });

            if (response.ok) {
                printLog(`VTT 字幕檔成功上傳至 AWS S3！檔名: ${fileName}`);
            } else {
                printLog("VTT 上傳失敗", await response.text());
            }
        } catch (error) {
            printLog("VTT 上傳發生錯誤", error);
        }
    }

    // ==========================================
    // 1. RTC 核心邏輯
    // ==========================================
    let rtc = { client: null, localAudioTrack: null, localVideoTrack: null };
    let options = {};
    let isVideoEnabled = true, isAudioMuted = false;

    function toggleRoleUI() {
      const role = document.querySelector('input[name="role"]:checked').value;
      document.getElementById('audience-options').classList.toggle('hidden', role !== 'audience');
      document.getElementById('local-stream-wrapper').classList.toggle('hidden', role === 'audience');
    }

    document.getElementById("toggle-video-btn").addEventListener("click", async function() {
      if (!rtc.localVideoTrack) return;
      isVideoEnabled = !isVideoEnabled;
      await rtc.localVideoTrack.setEnabled(isVideoEnabled);
      this.innerText = isVideoEnabled ? "關閉視訊" : "開啟視訊";
      this.classList.toggle('text-red-600', !isVideoEnabled);
    });

    document.getElementById("toggle-audio-btn").addEventListener("click", async function() {
      if (!rtc.localAudioTrack) return;
      isAudioMuted = !isAudioMuted;
      await rtc.localAudioTrack.setMuted(isAudioMuted);
      this.innerText = isAudioMuted ? "解除靜音" : "靜音";
      this.classList.toggle('text-red-600', isAudioMuted);
    });

    document.getElementById("join-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      options.appId = document.getElementById("appid").value;
      options.channel = document.getElementById("channel").value;
      options.token = document.getElementById("token").value; 
      options.uid = document.getElementById("uid").value ? parseInt(document.getElementById("uid").value) : null;
      options.role = document.querySelector('input[name="role"]:checked').value;
      
      const joinBtn = document.getElementById("join-btn");
      joinBtn.disabled = true; joinBtn.innerText = "連線中...";

      try {
        rtc.client = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        if (options.role === "host") { await rtc.client.setClientRole("host"); } 
        else { await rtc.client.setClientRole("audience", { level: parseInt(document.getElementById("audience-level").value) }); }

        rtc.client.on("user-published", handleUserPublished);
        rtc.client.on("user-unpublished", handleUserUnpublished);
        
        // [新增] 綁定 RTT 文字流接收事件
        rtc.client.on("stream-message", handleStreamMessage);

        options.uid = await rtc.client.join(options.appId, options.channel, options.token, options.uid);
        
        if (options.role === "host") {
          // 加入本地畫面與字幕容器
          document.getElementById("local-player").innerHTML = `
            <div class="video-label">UID: ${options.uid} (本地)</div>
            <div id="rec-indicator" class="hidden absolute top-4 right-4 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded animate-pulse-red z-20 flex items-center gap-1"><div class="w-2 h-2 bg-white rounded-full"></div> REC</div>
            <div id="subtitle-${options.uid}" class="subtitle-overlay hidden"><span class="subtitle-text"></span></div>
          `;
          [rtc.localAudioTrack, rtc.localVideoTrack] = await AgoraRTC.createMicrophoneAndCameraTracks();
          rtc.localVideoTrack.play("local-player");
          await rtc.client.publish([rtc.localAudioTrack, rtc.localVideoTrack]);
          
          document.getElementById("host-controls").classList.replace('hidden', 'flex');
        }

        joinBtn.innerText = "已加入";
        
        // [新增] 自動縮合 RTC 連線設定區塊
        const rtcContent = document.getElementById('rtc-section');
        const rtcIcon = document.getElementById('rtc-section-icon');
        if (!rtcContent.classList.contains('hidden')) {
          rtcContent.classList.add('hidden');
          rtcIcon.classList.remove('rotate-180');
        }

        document.getElementById("leave-btn").disabled = false;
        document.querySelectorAll('#join-form input, #join-form select').forEach(el => el.disabled = true);
      } catch (error) {
        console.error(error); alert("連線失敗: " + error.message);
        joinBtn.disabled = false; joinBtn.innerText = "加入頻道";
      }
    });

    document.getElementById("leave-btn").addEventListener("click", async function() {
      if (rtc.localAudioTrack) rtc.localAudioTrack.close();
      if (rtc.localVideoTrack) rtc.localVideoTrack.close();
      if (rtc.client) await rtc.client.leave();
      
      document.getElementById("local-player").innerHTML = "尚未加入頻道";
      document.getElementById("remote-playerlist").innerHTML = "";
      document.getElementById("no-remote-tips").style.display = "block";
      document.getElementById("host-controls").classList.replace('flex', 'hidden');
      
      document.getElementById("join-btn").disabled = false;
      document.getElementById("join-btn").innerText = "加入頻道";
      this.disabled = true;
      document.querySelectorAll('#join-form input, #join-form select').forEach(el => el.disabled = false);
    });

    async function handleUserPublished(user, mediaType) {
      document.getElementById("no-remote-tips").style.display = "none";
      await rtc.client.subscribe(user, mediaType);
      if (mediaType === "video") {
        const div = document.createElement("div");
        div.id = user.uid.toString();
        div.className = "w-full aspect-video bg-gray-800 rounded-lg overflow-hidden relative";
        // 加入遠端畫面與字幕容器
        div.innerHTML = `
          <div class="video-label">UID: ${user.uid} (遠端)</div>
          <div id="subtitle-${user.uid}" class="subtitle-overlay hidden"><span class="subtitle-text"></span></div>
        `;
        document.getElementById("remote-playerlist").append(div);
        user.videoTrack.play(div.id);
      }
      if (mediaType === "audio") user.audioTrack.play();
    }
    
    function handleUserUnpublished(user) {
      const el = document.getElementById(user.uid.toString());
      if (el) el.remove();
      if (document.getElementById("remote-playerlist").children.length === 0) { document.getElementById("no-remote-tips").style.display = "block"; }
    }

    // ==========================================
    // 發送 API 通用函式 & 日誌工具
    // ==========================================
    async function sendRecApi(path, method, bodyObj) {
      const proxyUrl = document.getElementById("proxy-url").value.trim();
      const cid = document.getElementById("customer-id").value.trim();
      const csec = document.getElementById("customer-secret").value.trim();
      
      if(!proxyUrl) throw new Error("請填寫 CF Worker Proxy URL");
      if(!cid || !csec) throw new Error("請填寫 Customer ID 與 Secret");
      
      const targetUrl = proxyUrl.replace(/\/$/, '') + path;
      const credentials = btoa(`${cid}:${csec}`);

      const response = await fetch(targetUrl, {
        method: method,
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Basic ${credentials}`
        },
        body: bodyObj ? JSON.stringify(bodyObj) : undefined
      });

      // 檢查是否為 204 No Content 或內容長度為 0 的成功回應
      if (response.status === 204 || response.headers.get("content-length") === "0") {
        if (!response.ok) throw new Error(`API 呼叫失敗，狀態碼: ${response.status}`);
        return { success: true };
      }

      const text = await response.text();
      const data = text ? JSON.parse(text) : {};
      
      if (!response.ok) {
        throw new Error(data.message || JSON.stringify(data) || "API 呼叫失敗");
      }
      return data;
    }

    function printLog(message, data = null) {
      const consoleEl = document.getElementById("log-console");
      const time = new Date().toLocaleTimeString();
      let logText = `[${time}] ${message}\n`;
      if (data) logText += JSON.stringify(data, null, 2) + "\n";
      consoleEl.innerHTML += logText + "------------------------\n";
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // ==========================================
    // 2. RTT 即時字幕邏輯與 UI 控制
    // ==========================================
    let rttState = { agentId: "" };
    
    const defaultRttPayload = {
      "languages": ["zh-TW"],
      "name": "agora-rtt-test",
      "maxIdleTime": 60,
      "rtcConfig": {
        "channelName": "", 
        "subBotUid": "",   
        "pubBotUid": ""    
      },
      "recognizeConfig": {
        "enableJsonProtocol": true
      }
    };
    document.getElementById("rtt-payload").value = JSON.stringify(defaultRttPayload, null, 2);

    function updateRttStatus(statusText, colorClass) {
      const badge = document.getElementById("rtt-status-badge");
      badge.innerText = statusText;
      badge.className = `px-2 py-1 rounded text-xs font-bold text-white ${colorClass}`;
    }

    document.getElementById("start-rtt-btn").addEventListener("click", async function() {
      const appId = document.getElementById("appid").value.trim();
      const channel = document.getElementById("channel").value.trim();
      const token = document.getElementById("token").value.trim();
      
      if(!appId || !channel) return alert("請先填寫 App ID 與 Channel Name");
      if(rttState.agentId) return alert("字幕任務正在進行中！請先停止。");

      this.disabled = true;
      try {
        updateRttStatus("STARTING...", "bg-orange-500");
        printLog("執行 Real-Time STT Start...");
        
        // 讀取 UI 上的扁平化 Payload 並動態填入 rtcConfig 參數
        let startPayload = JSON.parse(document.getElementById("rtt-payload").value);
        startPayload.rtcConfig.channelName = channel;
        startPayload.rtcConfig.subBotUid = String(Math.floor(Math.random() * 899999) + 100000);
        startPayload.rtcConfig.pubBotUid = String(Math.floor(Math.random() * 899999) + 100000);
        
        // 如果 RTC 頻道有開啟 Token 驗證，機器人也需要帶入 Token
        if (token) {
          startPayload.rtcConfig.subBotToken = token;
          startPayload.rtcConfig.pubBotToken = token;
        }

        // 新版 API 直接發送 POST 請求至 tasks 端點（不需先取得 builderToken）
        const startPath = `/api/speech-to-text/v1/projects/${appId}/join`;
        const startRes = await sendRecApi(startPath, "POST", startPayload);
        
        // 抓取新版 API 回傳的 agent_id
        rttState.agentId = startRes.agent_id || startRes.agentId;
        document.getElementById("lbl-taskId").innerText = rttState.agentId;
        document.getElementById("rtt-details").classList.remove('hidden');
        printLog("Real-Time STT Start 成功，字幕機器人已加入", startRes);

        updateRttStatus("LIVE (字幕監聽中)", "bg-green-500 animate-pulse");
        document.getElementById("stop-rtt-btn").disabled = false;
        
      } catch (error) {
        printLog("Real-Time STT 啟動失敗", { error: error.message });
        alert("啟動字幕失敗，請看 Log");
        updateRttStatus("ERROR", "bg-gray-500");
        this.disabled = false;
        rttState = { agentId: "" };
      }
    });

    document.getElementById("stop-rtt-btn").addEventListener("click", async function() {
      const appId = document.getElementById("appid").value.trim();
      
      this.disabled = true;
      updateRttStatus("STOPPING...", "bg-yellow-500");
      printLog("執行 Real-Time STT Stop...");

      try {
        // 使用 agent_id 進行停止請求 (POST)
        const stopPath = `/api/speech-to-text/v1/projects/${appId}/agents/${rttState.agentId}/leave`;
        const stopRes = await sendRecApi(stopPath, "POST");
        printLog("Real-Time STT Stop 成功", stopRes);

        updateRttStatus("STOPPED", "bg-gray-500");
        document.getElementById("start-rtt-btn").disabled = false;
        
        // 清空狀態與 UI
        rttState = { agentId: "" };
        document.getElementById("lbl-taskId").innerText = "-";
        document.getElementById("rtt-details").classList.add('hidden');
        
      } catch (error) {
        printLog("Real-Time STT Stop 失敗", { error: error.message });
        updateRttStatus("ERROR", "bg-gray-500");
        this.disabled = false;
      }
    });

    // 負責將文字渲染到對應 UID 的畫面上
    function displaySubtitle(uid, text) {
      // 1. 先嘗試尋找對應 UID 的容器
      let container = document.getElementById(`subtitle-${uid}`);
      
      // 2. 如果找不到（例如多人混流或 ID 沒對應上），直接抓取本地主畫面來顯示！
      if (!container) {
        const localPlayer = document.getElementById("local-player");
        if (localPlayer) {
          // 檢查本地畫面有沒有專屬的通用字幕層，沒有就動態建立一個
          let globalSub = document.getElementById("global-subtitle-overlay");
          if (!globalSub) {
            globalSub = document.createElement("div");
            globalSub.id = "global-subtitle-overlay";
            globalSub.className = "subtitle-overlay";
            globalSub.style.zIndex = "999";
            globalSub.innerHTML = `<span class="subtitle-text"></span>`;
            localPlayer.appendChild(globalSub);
          }
          container = globalSub;
        }
      }

      if (!container) return;

      const textSpan = container.querySelector('.subtitle-text') || container;
      textSpan.innerText = text;
      container.classList.remove('hidden');

      // 3 秒後自動隱藏字幕
      clearTimeout(container.hideTimeout);
      container.hideTimeout = setTimeout(() => {
        container.classList.add('hidden');
        textSpan.innerText = "";
      }, 3000);
    }

    // 監聽並解析從頻道傳來的資料流 (精密過濾雜訊版)
    function handleStreamMessage(uid, payload) {
      try {
        const textStr = new TextDecoder().decode(payload);
        
        // 直接把原始解碼出來的完整字串印到日誌面板上，讓你一眼看出雜訊長怎樣
        // printLog(`[原始封包內容] UID ${uid}: JSON.stringify(${JSON.stringify(textStr)})`);

        // 1. 優先嘗試：利用 Protobuf 封包特徵精準夾擊 (擷取 \n 與 \x10 之間的純文字)
        const structMatch = textStr.match(/\n.([\u4e00-\u9fa5a-zA-Z0-9，。！？,.!?\s]+)\x10/);
        
        let cleanText = "";

        // === 判斷區塊開始 ===
        if (structMatch && structMatch[1]) {
            // 情況 A: 成功夾擊
            cleanText = structMatch[1].trim();
        } else {
            // 情況 B: 備用方案
            const matches = textStr.match(/[\u4e00-\u9fa5a-zA-Z0-9，。！？,.!?]+/g);
            if (matches) {
              cleanText = matches
                .filter(str => {
                    // 剔除獨立出現的系統雜訊
                    if (str === 'j' || str === 'transcribez' || str === 'zh-TW') return false;
                    if (/^[0-9]+[A-Z]$/.test(str)) return false; 
                    if (/^[0-9]{1,2}$/.test(str) && matches.length > 2) return false; 
                    return true;
                })
                .join('')
                .trim();
            }
        } 
        // === 判斷區塊結束 ===

        // 3. 剔除開頭的半形或全形驚嘆號
        cleanText = cleanText
            .replace(/transcribez?/gi, '') // 忽略大小寫抹除 transcribez
            .replace(/zh-?TW/gi, '')       // 忽略大小寫抹除 zhTW 或 zh-TW
            .replace(/^[!！]+/, '')        // 剔除開頭的驚嘆號
            .trim();

        // 4. 無論是用哪種方式拿到 cleanText，都在這裡統一顯示並收集
        if (cleanText && cleanText.length > 1) {
            // 顯示在畫面
            displaySubtitle(uid, cleanText);

            // 如果正在錄製中，記錄到 VTT 陣列
            if (recordingStartTime) {
                const currentMs = Date.now() - recordingStartTime;
                const endMs = currentMs + 3000; // 預設字幕停留 3 秒
                
                const lastSub = vttSubtitles[vttSubtitles.length - 1];

                // 判斷是否為同一句話的持續更新：
                // 條件：與上一句開頭間隔小於 1.5 秒，且上一句「尚未」以句點或問號結尾
                const isSameSentence = lastSub && 
                                       (currentMs - lastSub.rawStartMs) < 1500 && 
                                       !/[。！？.!?]$/.test(lastSub.text.trim());

                if (isSameSentence) {
                    // 情況 A：同一句話，直接覆蓋內容並延長存活時間
                    lastSub.text = cleanText;
                    lastSub.end = formatVttTime(endMs);
                    lastSub.rawEndMs = endMs; 
                } else {
                    // 情況 B：全新的一句話
                    
                    // 【終極防疊機制】
                    // 如果上一句話預定的「結束時間」大於現在這句話的「開始時間」
                    // 就強制把上一句話的結束時間切斷，讓它提早下車，保證時間不重疊！
                    if (lastSub && lastSub.rawEndMs >= currentMs) {
                        lastSub.end = formatVttTime(currentMs - 1);
                        lastSub.rawEndMs = currentMs - 1;
                    }

                    // 推入全新的一句
                    vttSubtitles.push({
                        rawStartMs: currentMs,
                        rawEndMs: endMs, // 多存這個數字用來做重疊比對
                        start: formatVttTime(currentMs),
                        end: formatVttTime(endMs),
                        text: cleanText
                    });
                }
            }
        }
      } catch (error) {
        console.warn("解析失敗:", error);
      }
    }

    // ==========================================
    // 3. Cloud Recording 邏輯
    // ==========================================
    const defaultPayload = {
      "clientRequest": {
        "recordingConfig": {
          "maxIdleTime": 120,
          "streamTypes": 2,
          "channelType": 0,
          "transcodingConfig": { "height": 720, "width": 1280, "bitrate": 2260, "fps": 30, "mixedVideoLayout": 1 }
        },
        "recordingFileConfig": { "avFileType": ["hls", "mp4"] },
        "storageConfig": {
          "vendor": 1, "region": 9, "bucket": "<YOUR_AWS_bucket_name>",
          "accessKey": "<YOUR_accessKey>", "secretKey": "<YOUR_secretKey>", "fileNamePrefix": ["<YOUR_fileNamePrefix>"]
        }
      }
    };
    document.getElementById("recording-payload").value = JSON.stringify(defaultPayload, null, 2);

    let lastRecordedSid = null; // 專門用來記憶回放用的 SID
    let recordingState = { resourceId: "", sid: "", uid: "" };

    function updateRecStatus(statusText, colorClass, showIndicator = false) {
      const badge = document.getElementById("rec-status-badge");
      badge.innerText = statusText;
      badge.className = `px-2 py-1 rounded text-xs font-bold text-white ${colorClass}`;
      
      const indicator = document.getElementById("rec-indicator");
      if (indicator) { showIndicator ? indicator.classList.remove('hidden') : indicator.classList.add('hidden'); }
    }

    document.getElementById("start-rec-btn").addEventListener("click", async function() {
      const appId = document.getElementById("appid").value;
      const channel = document.getElementById("channel").value;
      
      if(!appId || !channel) return alert("請先在上方 RTC 面板填寫 App ID 與 Channel Name");
      if (recordingState.sid) return alert("錄製任務正在進行中！請先停止。");

      recordingState.uid = String(Math.floor(Math.random() * 899999) + 100000); 
      
      this.disabled = true;
      try {
        printLog("執行 Acquire...");
        updateRecStatus("ACQUIRING...", "bg-yellow-500");
        const acquireRes = await sendRecApi(`/v1/apps/${appId}/cloud_recording/acquire`, "POST", {
          cname: channel, uid: recordingState.uid, clientRequest: { resourceExpiredHour: 24, scene: 0 }
        });
        recordingState.resourceId = acquireRes.resourceId;
        document.getElementById("lbl-resourceId").innerText = recordingState.resourceId;
        document.getElementById("rec-details").classList.remove('hidden');

        printLog("執行 Start...");
        updateRecStatus("STARTING...", "bg-orange-500");
        let startPayload = JSON.parse(document.getElementById("recording-payload").value);
        startPayload.uid = recordingState.uid; 
        startPayload.cname = channel;
        startPayload.clientRequest.token = document.getElementById("token").value || undefined;

        const startRes = await sendRecApi(`/v1/apps/${appId}/cloud_recording/resourceid/${recordingState.resourceId}/mode/mix/start`, "POST", startPayload);
        recordingState.sid = startRes.sid;
        lastRecordedSid = startRes.sid; // 備份起來給播放器用
        document.getElementById("lbl-sid").innerText = recordingState.sid;

        recordingStartTime = Date.now(); // 鎖定錄製基準時間
        vttSubtitles = [];               // 清空上一局的字幕
        printLog("已標定錄製起始時間，開始收集 VTT 字幕...");

        updateRecStatus("RECORDING", "bg-red-600 animate-pulse", true);
        document.getElementById("stop-rec-btn").disabled = false;
        document.getElementById("query-rec-btn").disabled = false;
      } catch (error) {
        printLog("啟動失敗", { error: error.message });
        alert("啟動錄製失敗，請看 Log");
        updateRecStatus("ERROR", "bg-gray-500");
        this.disabled = false;
        recordingState = { resourceId: "", sid: "", uid: "" };
      }
    });

    document.getElementById("stop-rec-btn").addEventListener("click", async function() {
      const appId = document.getElementById("appid").value;
      const channel = document.getElementById("channel").value;

      this.disabled = true;
      document.getElementById("query-rec-btn").disabled = true;
      updateRecStatus("STOPPING...", "bg-yellow-500");
      printLog("執行 Stop...");
      
      try {
        const stopRes = await sendRecApi(`/v1/apps/${appId}/cloud_recording/resourceid/${recordingState.resourceId}/sid/${recordingState.sid}/mode/mix/stop`, "POST", {
          cname: channel, uid: recordingState.uid, clientRequest: {}
        });
        printLog("Stop 成功", stopRes);
        updateRecStatus("STOPPED", "bg-gray-500", false);

        recordingStartTime = null; // 停止計時
        // 如果這場錄製有收集到字幕，就產生 VTT 並上傳
        if (vttSubtitles.length > 0) {
            generateAndUploadVTT(stopRes.sid);
        }

        document.getElementById("start-rec-btn").disabled = false;
        
        recordingState = { resourceId: "", sid: "", uid: "" };
        document.getElementById("lbl-resourceId").innerText = "";
        document.getElementById("lbl-sid").innerText = "";
        document.getElementById("rec-details").classList.add('hidden');
      } catch (error) {
        printLog("Stop 失敗", { error: error.message });
        updateRecStatus("RECORDING", "bg-red-600 animate-pulse", true);
        this.disabled = false;
        document.getElementById("query-rec-btn").disabled = false;
      }
    });

    document.getElementById("query-rec-btn").addEventListener("click", async function() {
      const appId = document.getElementById("appid").value;
      this.disabled = true;
      printLog("查詢錄製狀態 (Query)...");
      try {
        const queryRes = await sendRecApi(`/v1/apps/${appId}/cloud_recording/resourceid/${recordingState.resourceId}/sid/${recordingState.sid}/mode/mix/query`, "GET");
        printLog("Query 回傳結果", queryRes);
      } catch (error) {
        printLog("Query 失敗", { error: error.message });
      } finally {
        this.disabled = false;
      }
    });

    // ==========================================
    // 4. HLS 播放器邏輯
    // ==========================================
    let hls = null;

    // 【修改 1】：把 function 改成 async function，這樣才能等待 VTT 上傳
    document.getElementById("load-hls-btn").addEventListener("click", async function() {
      const baseUrl = document.getElementById("hls-base-url").value.trim();
      const channel = document.getElementById("channel").value.trim();
      
      const sid = typeof lastRecordedSid !== 'undefined' && lastRecordedSid ? lastRecordedSid : recordingState.sid;

      if (!baseUrl) return alert("請先填寫 S3 / CDN 的 Base URL！");
      if (!sid) return alert("目前沒有進行中或已完成的錄製紀錄 (缺乏 SID)，無法產生回放網址！\n請先點擊「開始錄製」。");

      const formattedBaseUrl = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
      const m3u8Url = `${formattedBaseUrl}cloudRecording/${sid}_${channel}.m3u8`;
      
      // 【修改 2】：在 VTT 網址後加上時間戳 (?t=...) 破解瀏覽器快取，確保抓到最新版
      const vttUrl = `${formattedBaseUrl}cloudRecording/${sid}_${channel}.vtt?t=${Date.now()}`; 
      
      document.getElementById("hls-full-url").value = m3u8Url;
      const video = document.getElementById("hls-video-player");
      const statusBadge = document.getElementById("hls-status");

      // 每次點擊播放前，先清空可能殘留的舊字幕軌道
      video.innerHTML = '';

      // 【修改 3】：動態字幕掛載與快照上傳邏輯
      if (typeof recordingStartTime !== 'undefined' && recordingStartTime !== null) {
          // 情況 A：直播還在進行中！
          printLog("直播仍在進行中，正在產生即時字幕快照...");
          statusBadge.innerText = "字幕生成中...";
          
          // 強制觸發一次 VTT 上傳，並等待它完成
          await generateAndUploadVTT(sid);
          printLog("即時字幕快照上傳完成，準備掛載！");
      } else {
          // 情況 B：錄製已結束
          printLog("錄製已結束，載入最終版 VTT 字幕...");
      }

      // 無論是情況 A 還是 B，現在 S3 上一定都有最新 VTT 檔案了，直接掛載！
      const track = document.createElement("track");
      track.kind = "subtitles";
      track.label = "繁體中文";
      track.srclang = "zh-TW";
      track.src = vttUrl; 
      track.default = true; // 預設開啟
      video.appendChild(track);

      // 強制啟用的防呆邏輯
      track.addEventListener("load", function() {
          if (video.textTracks && video.textTracks.length > 0) {
              video.textTracks[0].mode = 'showing';
          }
      });

      if (hls) hls.destroy();

      printLog("準備載入 HLS 串流...", { url: m3u8Url });
      statusBadge.innerText = "連線中...";
      statusBadge.className = "text-xs font-medium text-yellow-600 bg-yellow-100 px-2 py-1 rounded";

      // --- 以下為原本的 hls.js 載入邏輯保持不變 ---
      if (Hls.isSupported()) {
        hls = new Hls({ liveSyncDurationCount: 3 });
        hls.loadSource(m3u8Url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          printLog("HLS Manifest 解析成功，開始播放！");
          statusBadge.innerText = "LIVE (回放中)";
          statusBadge.className = "text-xs font-medium text-green-600 bg-green-100 px-2 py-1 rounded";
          video.play();
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                printLog("HLS 網路錯誤 (可能是檔案還沒產生，或 CORS 被阻擋)", data);
                statusBadge.innerText = "網路錯誤";
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                printLog("HLS 媒體錯誤", data);
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                statusBadge.innerText = "載入失敗";
                statusBadge.className = "text-xs font-medium text-red-600 bg-red-100 px-2 py-1 rounded";
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = m3u8Url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
          statusBadge.innerText = "LIVE (Safari 原生)";
        });
      }
    });
  </script>
